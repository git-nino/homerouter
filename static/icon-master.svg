<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FTTH viewer app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d5b43"/>
      <stop offset="0.55" stop-color="#084434"/>
      <stop offset="1" stop-color="#04291f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9ff78"/>
      <stop offset="0.5" stop-color="#63e978"/>
      <stop offset="1" stop-color="#20bd72"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#8bff9b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8bff9b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background keeps Apple touch and maskable crops opaque. -->
  <rect width="512" height="512" fill="#052b21"/>

  <!-- Rounded green tile with a bright edge accent. -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#tile)"/>
  <rect x="21" y="21" width="470" height="470" rx="95" fill="none"
        stroke="url(#accent)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Soft Cloudflare-green halo behind the mark. -->
  <circle cx="256" cy="238" r="180" fill="url(#glow)"/>

  <!-- Clean white cloud. -->
  <g fill="#ffffff">
    <rect x="168" y="232" width="176" height="84"/>
    <circle cx="206" cy="232" r="58"/>
    <circle cx="270" cy="188" r="74"/>
    <circle cx="338" cy="236" r="60"/>
  </g>

  <!-- Green house/network symbol, centered inside the cloud. -->
  <g>
    <path d="M256 176 L326 232 H310 L256 190 L202 232 H186 Z" fill="url(#accent)"/>
    <path d="M210 228 H302 V292 H210 Z" fill="url(#accent)"/>
    <rect x="244" y="250" width="24" height="42" rx="5" fill="#ffffff"/>
    <circle cx="256" cy="166" r="7" fill="#d7ff8d"/>
  </g>
</svg>
